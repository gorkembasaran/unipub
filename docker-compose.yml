# Local / self-hosted stack: MongoDB + API + web.
#   cp .env.example .env   # then fill in what you need
#   docker compose up --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/unipub
      MONGO_DB_NAME: unipub
    depends_on:
      - mongo
    ports:
      - "3000:3000"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3001}
        NEXT_PUBLIC_DEMO_MODE: ${DEMO_MODE:-false}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3001:3001"

volumes:
  mongo-data:
